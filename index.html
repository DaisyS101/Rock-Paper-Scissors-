<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111022">
    <title>Rock Paper Scissors</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111022;
        color: #f7f5ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --muted: #aaa6c3;
        --panel: #1b1934;
        --panel-dark: #141229;
        --border: #393651;
        --accent: #b7a2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background:
          radial-gradient(ellipse at 50% 0%, #292344 0, transparent 55%),
          #111022;
      }

      main {
        width: min(100%, 620px);
        padding: 36px 42px 30px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: linear-gradient(145deg, #201d3b, var(--panel));
        box-shadow: 0 24px 70px #08071380;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3rem);
        letter-spacing: -0.055em;
      }

      .intro {
        margin: 10px 0 26px;
        color: var(--muted);
        line-height: 1.6;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 20px;
        padding: 18px 24px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: #17152d;
      }

      .score {
        display: grid;
        justify-items: center;
        gap: 4px;
      }

      .score strong {
        font-size: 2rem;
        line-height: 1;
      }

      .score span,
      .score-label {
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .score-label {
        white-space: nowrap;
      }

      .round {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        margin: 30px 0 22px;
        padding: 24px 20px;
        border-radius: 20px;
        background: var(--panel-dark);
      }

      .round-side {
        display: grid;
        justify-items: center;
        gap: 7px;
      }

      .move-icon {
        min-height: 52px;
        font-size: 2.5rem;
        line-height: 1.2;
      }

      .round-side span:last-child {
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .versus {
        color: #77728f;
        font-size: 0.75rem;
        font-weight: 900;
      }

      .result {
        min-height: 32px;
        margin: 0 0 18px;
        font-size: 1.15rem;
        font-weight: 800;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .choice {
        min-height: 112px;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 10px;
        border: 1px solid #46415f;
        border-radius: 18px;
        background: #25223f;
        color: inherit;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 750;
        cursor: pointer;
        transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
      }

      .choice:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        background: #302a50;
      }

      .choice:focus-visible,
      .reset:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .choice-icon {
        font-size: 2rem;
        line-height: 1;
      }

      .reset {
        margin-top: 22px;
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
      }

      .reset:hover {
        color: #fff;
      }

      @media (max-width: 480px) {
        main {
          padding: 28px 20px 22px;
          border-radius: 22px;
        }

        .scoreboard {
          gap: 10px;
          padding: 16px 12px;
        }

        .round {
          gap: 10px;
          padding: 20px 12px;
        }

        .choices {
          gap: 8px;
        }

        .choice {
          min-height: 100px;
          border-radius: 14px;
          font-size: 0.82rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">The classic showdown</p>
      <h1>Rock Paper Scissors</h1>
      <p class="intro">Make your move. Can you beat the computer?</p>

      <section class="scoreboard" aria-label="Score">
        <div class="score">
          <strong id="player-score">0</strong>
          <span>YOU</span>
        </div>
        <span class="score-label">SCORE</span>
        <div class="score">
          <strong id="computer-score">0</strong>
          <span>COMPUTER</span>
        </div>
      </section>

      <section class="round" aria-label="Last round">
        <div class="round-side">
          <span class="move-icon" id="player-move" aria-hidden="true">?</span>
          <span>YOU</span>
        </div>
        <span class="versus">VS</span>
        <div class="round-side">
          <span class="move-icon" id="computer-move" aria-hidden="true">?</span>
          <span>COMPUTER</span>
        </div>
      </section>

      <p class="result" id="result" aria-live="polite">Choose your move to start!</p>

      <div class="choices" role="group" aria-label="Choose rock, paper, or scissors">
        <button class="choice" type="button" data-move="rock" aria-label="Choose rock">
          <span class="choice-icon" aria-hidden="true">✊</span>
          <span>Rock</span>
        </button>
        <button class="choice" type="button" data-move="paper" aria-label="Choose paper">
          <span class="choice-icon" aria-hidden="true">✋</span>
          <span>Paper</span>
        </button>
        <button class="choice" type="button" data-move="scissors" aria-label="Choose scissors">
          <span class="choice-icon" aria-hidden="true">✌️</span>
          <span>Scissors</span>
        </button>
      </div>

      <button class="reset" id="reset" type="button">Reset score</button>
    </main>

    <script>
      const moves = {
        rock: { icon: "✊", beats: "scissors" },
        paper: { icon: "✋", beats: "rock" },
        scissors: { icon: "✌️", beats: "paper" },
      };
      const moveNames = Object.keys(moves);
      let playerScore = 0;
      let computerScore = 0;

      const playerScoreElement = document.querySelector("#player-score");
      const computerScoreElement = document.querySelector("#computer-score");
      const playerMoveElement = document.querySelector("#player-move");
      const computerMoveElement = document.querySelector("#computer-move");
      const resultElement = document.querySelector("#result");

      document.querySelectorAll(".choice").forEach((button) => {
        button.addEventListener("click", () => {
          const playerMove = button.dataset.move;
          const computerMove = moveNames[Math.floor(Math.random() * moveNames.length)];

          playerMoveElement.textContent = moves[playerMove].icon;
          computerMoveElement.textContent = moves[computerMove].icon;

          if (playerMove === computerMove) {
            resultElement.textContent = "It's a tie!";
          } else if (moves[playerMove].beats === computerMove) {
            playerScore += 1;
            resultElement.textContent = "You win this round!";
          } else {
            computerScore += 1;
            resultElement.textContent = "Computer wins this round!";
          }

          playerScoreElement.textContent = playerScore;
          computerScoreElement.textContent = computerScore;
        });
      });

      document.querySelector("#reset").addEventListener("click", () => {
        playerScore = 0;
        computerScore = 0;
        playerScoreElement.textContent = "0";
        computerScoreElement.textContent = "0";
        playerMoveElement.textContent = "?";
        computerMoveElement.textContent = "?";
        resultElement.textContent = "Choose your move to start!";
      });
    </script>
  </body>
</html>
